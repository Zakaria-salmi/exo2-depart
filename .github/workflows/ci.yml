name: Fablab CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {
          distribution: temurin,
          java-version: 17,
          cache: maven
        }

      - run: chmod +x mvnw
      - run: ./mvnw -B test
      - uses: actions/upload-artifact@v7
        if: always()
        with: {
          name: rapports-tests,
          path: target/surefire-reports
        }

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: {
          distribution: temurin,
          java-version: 17,
          cache: maven
        }
      - run: chmod +x mvnw
      - run: ./mvnw -B package -DskipTests
      - uses: actions/upload-artifact@v7
        with: {
          name: fablab-api,
          path: target/*.jar
        }



